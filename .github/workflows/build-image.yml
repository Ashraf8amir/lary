name: Build and Push Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      allow_index_drop:
        description: 'Allow dropping and recreating a changed index'
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Build production .env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          printf '%s\n' "$PROD_ENV" > .env.prod
          echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}" >> .env.prod

      - name: Upload deploy files
        run: |
          ssh server 'mkdir -p ~/apps/lary/nginx'
          # keep the current .env so we can roll back to the previous image
          ssh server 'cp ~/apps/lary/.env ~/apps/lary/.env.bak 2>/dev/null || true'
          scp docker-compose.prod.yml server:apps/lary/docker-compose.yml
          scp nginx/http.conf nginx/https.conf server:apps/lary/nginx/
          scp .env.prod server:apps/lary/.env

      - name: Deploy (with automatic rollback)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ALLOW_INDEX_DROP: ${{ inputs.allow_index_drop }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh server "docker login ghcr.io -u $GHCR_USER --password-stdin"
          ssh server "ALLOW_INDEX_DROP='$ALLOW_INDEX_DROP' bash -se" <<'EOF'
          set -Eeo pipefail
          cd ~/apps/lary
          chmod 600 .env

          rollback() {
            trap - ERR
            echo "Deploy failed. Rolling back..."
            if [ -f .env.bak ]; then
              cp .env.bak .env
              if docker compose up -d --wait --wait-timeout 120 app < /dev/null; then
                echo "Rolled back to: $(grep '^APP_IMAGE=' .env)"
              else
                echo "ROLLBACK FAILED - manual action needed"
              fi
            else
              echo "No previous .env found - manual action needed"
            fi
            docker logout ghcr.io || true
            exit 1
          }
          trap rollback ERR

          echo "Pulling new image..."
          docker compose pull app

          if [ "$ALLOW_INDEX_DROP" = "true" ]; then
            echo "Applying indexes (drop and recreate allowed)..."
            docker compose run --rm --no-deps -T -e INDEX_ALLOW_DROP=true app npm run db:indexes:prod < /dev/null
          else
            echo "Applying indexes..."
            docker compose run --rm --no-deps -T app npm run db:indexes:prod < /dev/null
          fi

          echo "Starting the new version..."
          docker compose up -d --remove-orphans --wait --wait-timeout 180 < /dev/null

          trap - ERR
          rm -f .env.bak
          docker image prune -f
          docker logout ghcr.io
          echo "Deployment completed: $(grep '^APP_IMAGE=' .env)"
          EOF
