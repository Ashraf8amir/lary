name: Bug
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - type:bug

body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch Name
      placeholder: fix/short-description

  - type: input
    id: milestone
    attributes:
      label: Milestone
      placeholder: Sprint 01 — Project Setup & Foundation